workflows:
  xqassist:
    name: XqAssist - TrollStore unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Restore source and generate Xcode project
        script: |
          set -e
          rm -rf /tmp/xiangqi_src
          mkdir -p /tmp/xiangqi_src
          unzip -q "$CM_BUILD_DIR/source.zip" -d /tmp/xiangqi_src
          cd /tmp/xiangqi_src/XiangqiAssistant
          brew install xcodegen
          xcodegen generate
          test -d XqAssist.xcodeproj
      - name: Build unsigned iOS app
        script: |
          set -o pipefail
          cd /tmp/xiangqi_src/XiangqiAssistant
          xcodebuild -project XqAssist.xcodeproj -scheme XqAssist \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          cp build.log "$CM_BUILD_DIR/build.log"
      - name: Package unsigned IPA for TrollStore
        script: |
          set -e
          cd /tmp/xiangqi_src/XiangqiAssistant
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/XqAssist.app Payload/
          zip -qr "$CM_BUILD_DIR/XqAssist.ipa" Payload
          cp "$CM_BUILD_DIR/XqAssist.ipa" "$CM_BUILD_DIR/XqAssist.zip"
    artifacts:
      - XqAssist.ipa
      - XqAssist.zip
      - build.log
