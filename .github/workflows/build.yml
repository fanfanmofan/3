name: Build IPA
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project XqAssist.xcodeproj -scheme XqAssist \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/XqAssist.app Payload/
          zip -qr XqAssist.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: XqAssist-ipa
          path: XqAssist.ipa
